name: Security audit

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
